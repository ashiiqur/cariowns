<script>
        // Header logo: favicon SVG (embedded as its src, right in the HTML)
        // stands in until the real logo.png has fully loaded, then
        // crossfades in.
        (function() {
            const img = document.querySelector('.logo-img');
            if (!img) return;
            const realSrc = img.getAttribute('data-src');
            if (!realSrc) return;
            img.style.transition = 'opacity 0.35s ease';

            const loader = new Image();
            loader.onload = () => {
                img.style.opacity = '0';
                setTimeout(() => {
                    img.src = realSrc;
                    requestAnimationFrame(() => { img.style.opacity = '1'; });
                }, 200);
            };
            loader.src = realSrc;
        })();
    </script>
